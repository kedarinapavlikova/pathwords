<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PathWords 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --cream: #FDFCF0;
    --pollen: #FEF5C8;
    --gold: #F4C430;
    --gold-dark: #d4a820;
    --sage: #A3B18A;
    --sage-dark: #7a8c68;
    --charcoal: #333333;
    --pink: #F2C6C2;
    --blue: #A8D0E6;
    --pink-dark: #e09a94;
    --red: #e05555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #FFFFFF !important;
    color-scheme: light only !important;
  }

  body {
    background: #FFFFFF !important;
    font-family: 'Nunito', sans-serif;
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding-bottom: 40px;
  }

  .header {
    text-align: center;
    padding: 22px 20px 6px;
  }

  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    color: var(--charcoal);
    letter-spacing: 1px;
    line-height: 1.1;
  }

  .logo span { color: var(--pink-dark); }

  .score-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin: 10px 20px 4px;
    flex-wrap: wrap;
  }

  .score-pill {
    background: var(--pollen);
    border: 2.5px solid var(--gold);
    border-radius: 30px;
    padding: 5px 16px;
    font-size: 0.98rem;
    font-weight: 800;
    color: var(--charcoal);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .score-pill .label {
    font-weight: 700;
    color: var(--sage-dark);
    font-size: 0.8rem;
  }

  .found-section {
    width: 100%; max-width: 520px;
    padding: 0 16px;
    margin: 6px 0;
  }

  .found-label {
    font-size: 0.76rem;
    font-weight: 800;
    color: var(--sage-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .found-words {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 34px;
    background: var(--cream);
    border-radius: 14px;
    border: 2px solid #e8e4cc;
    padding: 7px 10px;
  }

  .word-chip {
    background: var(--sage);
    color: white;
    border-radius: 20px;
    padding: 3px 11px;
    font-size: 0.86rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .builder-section {
    width: 100%; max-width: 520px;
    padding: 0 16px;
    margin: 8px 0 0;
  }

  .word-display {
    background: var(--cream);
    border: 3px solid var(--gold);
    border-radius: 18px;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 14px;
    gap: 4px;
    flex-wrap: wrap;
  }

  .word-display.shake {
    animation: shake 0.4s ease;
    border-color: var(--red);
  }

  .word-display.glow {
    animation: glow 0.5s ease;
    border-color: var(--sage);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  @keyframes glow {
    0%   { box-shadow: 0 0 0 0 rgba(163,177,138,0.7); }
    50%  { box-shadow: 0 0 0 14px rgba(163,177,138,0); }
    100% { box-shadow: none; }
  }

  .word-letter {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.45rem, 5vw, 1.85rem);
    color: var(--charcoal);
    background: var(--pollen);
    border-radius: 9px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: letterAppear 0.15s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes letterAppear {
    from { transform: scale(0) translateY(8px); opacity: 0; }
    to   { transform: scale(1) translateY(0);   opacity: 1; }
  }

  .placeholder-text {
    font-size: 0.92rem;
    color: #bbb;
    font-weight: 700;
  }

  .feedback {
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 800;
    margin-top: 4px;
  }

  .feedback.good { color: var(--sage-dark); }
  .feedback.bad  { color: var(--red); }
  .feedback.dup  { color: var(--gold-dark); }

  /* 9-letter grid: 3×3 */
  .hex-section {
    margin: 18px 0 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .hex-row {
    display: flex;
    gap: 9px;
  }

  .hex-btn {
    width: clamp(64px, 16vw, 80px);
    height: clamp(64px, 16vw, 80px);
    background: var(--pollen);
    border: 3px solid var(--gold);
    border-radius: 50%;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.4rem, 4.5vw, 1.8rem);
    color: var(--charcoal);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s, background 0.12s, box-shadow 0.12s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.10);
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }

  .hex-btn:active, .hex-btn.pressed {
    transform: scale(0.88) translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.10);
    background: var(--gold);
  }

  .actions {
    position: relative; z-index: 1;
    display: flex;
    gap: 9px;
    margin: 18px 0 4px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 16px;
  }

  .btn {
    border: none;
    border-radius: 30px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1rem;
    cursor: pointer;
    padding: 10px 20px;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    outline: none;
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.12);
  }

  .btn-delete {
    background: var(--pink);
    color: var(--charcoal);
    border: 2.5px solid var(--pink-dark);
    font-size: 1.25rem;
    padding: 8px 16px;
  }

  .btn-clear {
    background: white;
    color: var(--charcoal);
    border: 2.5px solid #ddd;
    padding: 10px 16px;
  }

  .btn-submit {
    background: var(--sage);
    color: white;
    border: 2.5px solid var(--sage-dark);
    font-size: 0.98rem;
    padding: 10px 26px;
    flex-grow: 1;
    max-width: 180px;
  }

  .btn-submit:disabled {
    opacity: 0.38;
    cursor: not-allowed;
  }

  .btn-new {
    background: var(--gold);
    color: var(--charcoal);
    border: 2.5px solid var(--gold-dark);
    font-size: 0.9rem;
    padding: 8px 20px;
  }

  .divider-vine {
    text-align: center;
    font-size: 0.75rem;
    color: #ddd;
    margin: 6px 0;
    user-select: none;
    letter-spacing: 4px;
  }

  .confetti-container {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
    contain: strict;
    will-change: contents;
  }

  .confetti-piece {
    position: absolute;
    animation: confettiFall 1.3s ease-out forwards;
    will-change: transform, opacity;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(90px) rotate(380deg) scale(0.2); opacity: 0; }
  }

  .progress-section {
    text-align: center;
    margin: 4px 0 0;
    min-height: 28px; /* fixed height — never causes layout shift */
  }

  .progress-flowers { font-size: 1.15rem; letter-spacing: 3px; }

  .divider {
    width: 100%; max-width: 520px;
    border: none;
    border-top: 2px dashed #e8e4cc;
    margin: 9px 0;
  }
</style>
</head>
<body>

<div class="confetti-container" id="confettiContainer"></div>

<div class="header">
  <div class="logo">🌹 Path<span>Words</span></div>
</div>

<div class="score-bar">
  <div class="score-pill"><span class="label">Words</span><span id="wordCount">0</span></div>
  <div class="score-pill"><span class="label">Points</span><span id="scoreCount">0</span></div>
  <button class="btn btn-new" onclick="newGame()">🌹 New Game</button>
</div>

<div class="divider-vine">· · ·</div>
<div class="found-section">
  <div class="found-label">🌹 Words found</div>
  <div class="found-words" id="foundWords">
    <span class="placeholder-text">No words yet — tap letters below!</span>
  </div>
</div>

<div class="divider-vine">· · ·</div>
<div class="builder-section">
  <div class="word-display" id="wordDisplay">
    <span class="placeholder-text">Tap letters to start!</span>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="hex-section" id="hexSection"></div>

<div class="actions">
  <button class="btn btn-delete" onclick="deleteLetter()">⌫</button>
  <button class="btn btn-submit" id="submitBtn" onclick="submitWord()" disabled>✓ Check Word</button>
  <button class="btn btn-clear" onclick="clearWord()">✕ Clear</button>
</div>

<div class="progress-section" id="progressSection"></div>

// ─── 9-LETTER SETS ─────────────────────────────────────────────────────────────
// Each set has exactly 9 unique letters, 3–4 vowels, rest common consonants
// All sets tested to yield many 2–6 letter words
const LETTER_SETS = [
  ['A','E','I','O','R','S','T','N','L'],  // Garden Path
  ['A','E','O','U','R','S','T','N','D'],  // Sunny Meadow
  ['A','E','I','U','R','S','T','N','B'],  // Rosebush
  ['A','E','O','I','L','S','T','C','H'],  // Daisy Field
  ['A','E','O','U','L','S','T','C','R'],  // Morning Dew
  ['A','E','I','O','N','R','S','T','G'],  // Petal Lane
  ['A','E','I','U','N','R','S','L','D'],  // Wildflower
  ['A','O','U','I','T','R','S','N','G'],  // Blossom Walk
  ['A','E','O','U','T','R','S','N','F'],  // Forest Glen
  ['E','I','O','A','R','N','S','T','P'],  // Clover Hill
  ['A','E','I','O','R','S','T','D','W'],  // Dewdrop Path
  ['A','E','U','O','R','N','S','T','G'],  // Honeybee Run
  ['A','E','I','O','B','C','L','N','R'],  // Birch Grove
  ['A','I','O','U','R','S','T','L','N'],  // Tulip Garden
  ['A','E','O','I','R','S','N','D','P'],  // Pond Walk
  ['A','E','I','U','M','R','S','T','N'],  // Lily Pond
  ['E','O','A','U','T','H','R','S','N'],  // Heather Moor
  ['A','E','I','O','R','S','F','T','N'],  // Fern Trail
  ['A','E','I','O','R','S','T','C','K'],  // Rosecroft
  ['A','E','O','U','B','R','S','T','N'],  // Sunburst
];

// ─── GAME STATE ───────────────────────────────────────────────────────────────
let letters = [];
let currentWord = [];
let foundWords = [];
let score = 0;
const FLOWERS = ['🌸','🌼','🌺','🌷','🌻','💐','🌹','🏵️'];

function newGame() {
  const set = LETTER_SETS[Math.floor(Math.random() * LETTER_SETS.length)];
  letters = [...set].sort(() => Math.random() - 0.5);
  currentWord = [];
  foundWords = [];
  score = 0;
  renderGrid();
  renderFoundWords();
  updateScore();
  updateWordDisplay();
  setFeedback('', '');
  document.getElementById('progressSection').innerHTML = '';
}

function renderGrid() {
  const section = document.getElementById('hexSection');
  section.innerHTML = '';
  [[0,1,2],[3,4,5],[6,7,8]].forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'hex-row';
    row.forEach(i => {
      const btn = document.createElement('button');
      btn.className = 'hex-btn';
      btn.id = `hex-${i}`;
      btn.textContent = letters[i];
      btn.setAttribute('aria-label', `Letter ${letters[i]}`);
      btn.addEventListener('click', () => tapLetter(i));
      btn.addEventListener('touchstart', e => { e.preventDefault(); tapLetter(i); }, {passive:false});
      rowDiv.appendChild(btn);
    });
    section.appendChild(rowDiv);
  });
}

function tapLetter(i) {
  const btn = document.getElementById(`hex-${i}`);
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 120);
  currentWord.push({letter: letters[i], index: i});
  updateWordDisplay();
  setFeedback('', '');
}

function deleteLetter() {
  if (!currentWord.length) return;
  currentWord.pop();
  updateWordDisplay();
  setFeedback('', '');
}

function clearWord() {
  currentWord = [];
  updateWordDisplay();
  setFeedback('', '');
}

function updateWordDisplay() {
  const display = document.getElementById('wordDisplay');
  if (!currentWord.length) {
    display.innerHTML = '<span class="placeholder-text">Tap letters to start!</span>';
    document.getElementById('submitBtn').disabled = true;
    return;
  }
  display.innerHTML = '';
  currentWord.forEach(({letter}) => {
    const span = document.createElement('span');
    span.className = 'word-letter';
    span.textContent = letter;
    display.appendChild(span);
  });
  document.getElementById('submitBtn').disabled = currentWord.length < 2;
}

const wordCache = {};

async function submitWord() {
  const word = currentWord.map(l => l.letter).join('').toLowerCase();
  if (word.length < 2) { setFeedback('Need 2+ letters! 🌱', 'bad'); return; }
  if (foundWords.includes(word)) {
    setFeedback('Already found that one! 🌸', 'dup');
    shakeBuild(); return;
  }

  // Lock button during check
  document.getElementById('submitBtn').disabled = true;

  // 1. Check local list instantly
  if (WORD_LIST.has(word)) {
    document.getElementById('submitBtn').disabled = false;
    acceptWord(word); return;
  }

  // 2. Check cache (already looked this up before)
  if (word in wordCache) {
    document.getElementById('submitBtn').disabled = false;
    if (wordCache[word]) { acceptWord(word); }
    else { rejectWord(word); }
    return;
  }

  // 3. Hit the free dictionary API
  setFeedback('🔍 Checking...', '');
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    wordCache[word] = res.ok;
    document.getElementById('submitBtn').disabled = false;
    if (res.ok) { acceptWord(word); }
    else { rejectWord(word); }
  } catch {
    // Offline fallback — local list only
    document.getElementById('submitBtn').disabled = false;
    rejectWord(word);
  }
}

function acceptWord(word) {
  foundWords.push(word);
  score += word.length;
  updateScore();
  renderFoundWords();
  triggerConfetti();
  glowBuild();
  setFeedback(successMsg(word.length), 'good');
  updateProgress();
  currentWord = [];
  setTimeout(updateWordDisplay, 300);
}

function rejectWord(word) {
  setFeedback(`Hmm, "${word}" isn't a word — try again! 🤔`, 'bad');
  shakeBuild();
  currentWord = [];
  updateWordDisplay();
}

function successMsg(len) {
  const pts = `+${len} point${len > 1 ? 's' : ''}`;
  if (len <= 2) return `✨ Nice! ${pts}`;
  if (len === 3) return `🌸 Good! ${pts}`;
  if (len === 4) return `🌺 Great! ${pts}`;
  if (len === 5) return `🌼 Brilliant! ${pts}`;
  return `🌻 Amazing! ${pts}`;
}

function shakeBuild() {
  const d = document.getElementById('wordDisplay');
  d.classList.remove('shake'); void d.offsetWidth;
  d.classList.add('shake');
  setTimeout(() => d.classList.remove('shake'), 400);
}

function glowBuild() {
  const d = document.getElementById('wordDisplay');
  d.classList.remove('glow'); void d.offsetWidth;
  d.classList.add('glow');
  setTimeout(() => d.classList.remove('glow'), 500);
}

function setFeedback(msg, type) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + type;
}

function renderFoundWords() {
  const el = document.getElementById('foundWords');
  if (!foundWords.length) {
    el.innerHTML = '<span class="placeholder-text">No words yet — tap letters below!</span>';
    return;
  }
  // First word: clear placeholder and add chip
  if (foundWords.length === 1) { el.innerHTML = ''; }
  // Always prepend the newest word only
  const word = foundWords[foundWords.length - 1];
  const chip = document.createElement('span');
  chip.className = 'word-chip';
  chip.textContent = word;
  el.insertBefore(chip, el.firstChild);
}

function updateScore() {
  document.getElementById('wordCount').textContent = foundWords.length;
  document.getElementById('scoreCount').textContent = score;
}

function updateProgress() {
  const section = document.getElementById('progressSection');
  const flowers = foundWords.map((_, i) => FLOWERS[i % FLOWERS.length]).join('');
  section.innerHTML = `<div class="progress-flowers">${flowers}</div>`;
}

function triggerConfetti() {
  requestAnimationFrame(() => {
    const container = document.getElementById('confettiContainer');
    const emojis = ['🌸','🌼','✨','🌺','💛','🌷','⭐','🌻','💫','🎉'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = (15 + Math.random() * 70) + '%';
      p.style.top  = (25 + Math.random() * 25) + '%';
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      p.style.fontSize = (0.9 + Math.random() * 0.9) + 'rem';
      container.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
  });
}

newGame();
