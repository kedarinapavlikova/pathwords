<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PathWords 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --cream: #FDFCF0;
    --pollen: #FEF5C8;
    --gold: #F4C430;
    --gold-dark: #d4a820;
    --sage: #A3B18A;
    --sage-dark: #7a8c68;
    --charcoal: #333333;
    --pink: #F2C6C2;
    --pink-dark: #e09a94;
    --red: #e05555;
    --placeholder: #bbbbbb;
    --found-border: #e8e4cc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { background: var(--bg); color-scheme: light only !important; }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding-bottom: 40px;
    transition: background 0.3s, color 0.3s;
  }

  .header {
    position: relative; z-index: 1;
    text-align: center;
    padding: 22px 20px 6px;
  }

  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    color: var(--charcoal);
    letter-spacing: 1px;
    line-height: 1.1;
  }

  .logo span { color: var(--pink-dark); }

  .tagline {
    font-size: 0.88rem;
    color: var(--sage-dark);
    font-weight: 700;
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  .score-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin: 10px 20px 4px;
    flex-wrap: wrap;
  }

  .score-pill {
    background: var(--pollen);
    border: 2.5px solid var(--gold);
    border-radius: 30px;
    padding: 5px 16px;
    font-size: 0.98rem;
    font-weight: 800;
    color: var(--charcoal);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .score-pill .label {
    font-weight: 700;
    color: var(--sage-dark);
    font-size: 0.8rem;
  }

  .found-section {
    width: 100%; max-width: 520px;
    padding: 0 16px;
    margin: 4px 0;
  }

  .found-label {
    font-size: 0.76rem;
    font-weight: 800;
    color: var(--sage-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .found-words {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 34px;
    background: var(--cream);
    border-radius: 14px;
    border: 2px solid var(--found-border);
    padding: 7px 10px;
  }

  .word-chip {
    background: var(--sage);
    color: white;
    border-radius: 20px;
    padding: 3px 11px;
    font-size: 0.86rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .builder-section {
    width: 100%; max-width: 520px;
    padding: 0 16px;
    margin: 8px 0 3px;
  }

  .word-display {
    background: var(--cream);
    border: 3px solid var(--gold);
    border-radius: 18px;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 14px;
    gap: 4px;
    flex-wrap: wrap;
  }

  .word-display.shake {
    animation: shake 0.4s ease;
    border-color: var(--red);
  }

  .word-display.glow {
    animation: glow 0.5s ease;
    border-color: var(--sage);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  @keyframes glow {
    0%   { box-shadow: 0 0 0 0 rgba(163,177,138,0.7); }
    50%  { box-shadow: 0 0 0 14px rgba(163,177,138,0); }
    100% { box-shadow: none; }
  }

  .word-letter {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.45rem, 5vw, 1.85rem);
    color: var(--charcoal);
    background: var(--pollen);
    border-radius: 9px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: letterAppear 0.15s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes letterAppear {
    from { transform: scale(0) translateY(8px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  .placeholder-text {
    font-size: 0.92rem;
    color: var(--placeholder);
    font-weight: 700;
  }

  .feedback {
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 800;
    margin-top: 4px;
  }

  .feedback.good { color: var(--sage-dark); }
  .feedback.bad  { color: var(--red); }
  .feedback.dup  { color: var(--gold-dark); }

  .hex-section {
    margin: 8px 0 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .hex-row { display: flex; gap: 9px; }

  .hex-btn {
    width: clamp(64px, 16vw, 80px);
    height: clamp(64px, 16vw, 80px);
    background: var(--pollen);
    border: 3px solid var(--gold);
    border-radius: 50%;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.4rem, 4.5vw, 1.8rem);
    color: var(--charcoal);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s, background 0.12s, box-shadow 0.12s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.10);
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }

  .hex-btn:active, .hex-btn.pressed {
    transform: scale(0.88) translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.10);
    background: var(--gold);
  }

  .actions {
    display: flex;
    gap: 14px;
    margin: 12px 0 6px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 16px;
  }

  .btn {
    border: none;
    border-radius: 30px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1rem;
    cursor: pointer;
    padding: 10px 20px;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    outline: none;
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.12);
  }

  .btn-delete {
    background: var(--pink);
    color: var(--charcoal);
    border: 2.5px solid var(--pink-dark);
    font-size: 1.25rem;
    padding: 8px 16px;
  }

  .btn-clear {
    background: var(--cream);
    color: var(--charcoal);
    border: 2.5px solid var(--found-border);
    padding: 10px 16px;
  }

  .btn-submit {
    background: var(--sage);
    color: white;
    border: 2.5px solid var(--sage-dark);
    font-size: 0.98rem;
    padding: 10px 26px;
    flex-grow: 1;
    max-width: 180px;
  }

  .btn-submit:disabled {
    opacity: 0.38;
    cursor: not-allowed;
  }

  .btn-share {
    background: var(--pink);
    color: var(--charcoal);
    border: 2.5px solid var(--pink-dark);
    font-size: 0.95rem;
    padding: 10px 28px;
  }

  .btn-new {
    background: var(--gold);
    color: var(--charcoal);
    border: 2.5px solid var(--gold-dark);
    font-size: 0.9rem;
    padding: 8px 20px;
  }

  .progress-section {
    text-align: center;
    margin: 4px 0 0;
    min-height: 28px;
  }

  .progress-flowers { font-size: 1.15rem; letter-spacing: 3px; }

  /* ── Theme picker ───────────────────────────── */
  .theme-section {
    width: 100%; max-width: 520px;
    padding: 24px 16px 0;
    margin-top: 20px;
    border-top: 2px dashed var(--found-border);
  }

  .theme-label {
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--sage-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
  }

  .theme-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .theme-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 10px;
    border-radius: 12px;
    border: 2px solid var(--found-border);
    background: var(--cream);
    cursor: pointer;
    min-width: 58px;
    font-family: 'Nunito', sans-serif;
    transition: transform 0.12s;
    outline: none;
  }

  .theme-btn:active { transform: scale(0.92); }

  .theme-btn.active {
    border: 2.5px solid var(--gold-dark);
    background: var(--pollen);
  }

  .theme-emoji { font-size: 1.3rem; }

  .theme-name {
    font-size: 0.62rem;
    font-weight: 800;
    color: var(--sage-dark);
  }

  /* ── AI Theme Generator ─────────────────────── */
  .ai-theme-section {
    width: 100%; max-width: 520px;
    padding: 10px 16px 0;
    margin-top: 20px;
  }

  .ai-theme-label {
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--sage-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
  }

  .ai-theme-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .ai-theme-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 30px;
    border: 2.5px solid var(--found-border);
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    outline: none;
    transition: border-color 0.2s;
  }

  .ai-theme-input:focus {
    border-color: var(--gold);
  }

  .ai-theme-input::placeholder {
    color: var(--placeholder);
  }

  .btn-ai {
    background: var(--gold);
    color: var(--charcoal);
    border: 2.5px solid var(--gold-dark);
    white-space: nowrap;
    padding: 10px 16px;
    font-size: 0.88rem;
  }

  .btn-ai:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .ai-status {
    text-align: center;
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--sage-dark);
    min-height: 22px;
    margin-top: 6px;
  }

  .coming-soon-pill {
    display: inline-block;
    background: var(--pink);
    color: var(--pink-dark);
    border: 1.5px solid var(--pink-dark);
    border-radius: 20px;
    font-size: 0.62rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    margin-left: 6px;
    vertical-align: middle;
    text-transform: uppercase;
  }

  .ai-theme-section.disabled-section {
    opacity: 0.45;
    pointer-events: none;
  }

  /* ── Level-up toast ─────────────────────────── */
  .levelup-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    background: var(--pollen);
    border: 3px solid var(--gold);
    border-radius: 24px;
    padding: 22px 36px;
    text-align: center;
    z-index: 200;
    pointer-events: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    animation: toastPop 2.4s ease forwards;
  }

  .levelup-toast .toast-emoji { font-size: 2.4rem; display: block; margin-bottom: 6px; }
  .levelup-toast .toast-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    color: var(--charcoal);
    display: block;
  }
  .levelup-toast .toast-sub {
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--sage-dark);
    display: block;
    margin-top: 3px;
  }

  @keyframes toastPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    25%  { transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
  }

  /* ── Confetti ───────────────────────────────── */
  .confetti-container {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
    contain: strict;
    will-change: contents;
  }

  .confetti-piece {
    position: absolute;
    animation: confettiFall 1.3s ease-out forwards;
    will-change: transform, opacity;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(90px) rotate(380deg) scale(0.2); opacity: 0; }
  }
</style>
</head>

<div class="confetti-container" id="confettiContainer"></div>

<div class="header">
  <div class="logo" id="logoEl">🌹 Path<span>Words</span></div>
  <div class="tagline" id="taglineEl">🌿 Wander the garden · Find words · Bloom! 🌸</div>
</div>

<div class="score-bar">
  <div class="score-pill"><span class="label">Words</span><span id="wordCount">0</span></div>
  <div class="score-pill"><span class="label">Points</span><span id="scoreCount">0</span></div>
  <div class="score-pill" id="levelPill"><span class="label">Level</span><span id="levelName">🌱 Seedling</span></div>
  <button class="btn btn-new" id="newGameBtn" onclick="newGame()">🌹 New Game</button>
</div>

<div class="found-section">
  <div class="found-label" id="foundLabel">🌹 Words found</div>
  <div class="found-words" id="foundWords">
    <span class="placeholder-text">No words yet — tap letters below!</span>
  </div>
</div>

<div class="builder-section">
  <div class="word-display" id="wordDisplay">
    <span class="placeholder-text">Tap letters to start!</span>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="hex-section" id="hexSection"></div>

<div class="actions">
  <button class="btn btn-delete" onclick="deleteLetter()">⌫</button>
  <button class="btn btn-submit" id="submitBtn" onclick="submitWord()" disabled>✓ Check Word</button>
  <button class="btn btn-clear" onclick="clearWord()">✕ Clear</button>
</div>

<div class="actions" style="margin-top:4px;">
  <button class="btn btn-share" id="shareBtn" onclick="shareScore()">🌸 Share my score</button>
</div>
<div id="shareConfirm" style="height:22px;text-align:center;font-size:0.85rem;font-weight:800;color:var(--sage-dark);margin-top:2px;"></div>

<div class="progress-section" id="progressSection"></div>

<div class="theme-section">
  <div class="theme-label">🎨 Choose a theme</div>
  <div class="theme-row" id="themeRow"></div>
</div>

<div class="ai-theme-section disabled-section">
  <div class="ai-theme-label">✨ Make your own theme<span class="coming-soon-pill">Coming Soon</span></div>
  <div class="ai-theme-row">
    <input class="ai-theme-input" id="aiThemeInput" type="text" placeholder="e.g. underwater pirates, cozy winter…" maxlength="60" disabled />
    <button class="btn btn-ai" id="aiThemeBtn" disabled>✨ Create</button>
  </div>
  <div class="ai-status" id="aiStatus"></div>
</div>

function applyTheme(key) {
  const theme = THEMES[key];
  if (!theme) return;

  const root = document.documentElement;
  Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));

  document.getElementById('logoEl').innerHTML = theme.logo;
  document.getElementById('taglineEl').textContent = theme.tagline;
  document.getElementById('foundLabel').textContent = theme.foundLabel;
  document.getElementById('newGameBtn').textContent = theme.newGame;
  document.getElementById('shareBtn').textContent = theme.share;

  // Refresh level name in new theme's vocabulary
  const levels = theme.levels || ['🌱 Lv1','🌸 Lv2','🌺 Lv3','🌻 Lv4'];
  document.getElementById('levelName').textContent = levels[Math.min(currentLevel, levels.length - 1)];

  // Update progress if words found
  if (foundWords.length > 0) updateProgress();

  // Mark active button
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === key);
  });

  // Save preference
  try { localStorage.setItem('pathwords-theme', key); } catch {}
}

function buildThemePicker() {
  const row = document.getElementById('themeRow');
  row.innerHTML = '';
  Object.values(THEMES).forEach(theme => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (theme.key === 'garden' ? ' active' : '');
    btn.dataset.theme = theme.key;
    btn.innerHTML = `<span class="theme-emoji">${theme.emoji}</span><span class="theme-name">${theme.name}</span>`;
    btn.onclick = () => applyTheme(theme.key);
    row.appendChild(btn);
  });
}

// ─── GAME FUNCTIONS ───────────────────────────────────────────────────────────
function newGame() {
  const set = LETTER_SETS[Math.floor(Math.random() * LETTER_SETS.length)];
  letters = [...set].sort(() => Math.random() - 0.5);
  currentWord = [];
  foundWords = [];
  score = 0;
  currentLevel = 0;
  renderGrid();
  renderFoundWords();
  updateScore();
  updateWordDisplay();
  setFeedback('', '');
  document.getElementById('progressSection').innerHTML = '';
}

function renderGrid() {
  const section = document.getElementById('hexSection');
  section.innerHTML = '';
  [[0,1,2],[3,4,5],[6,7,8]].forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'hex-row';
    row.forEach(i => {
      const btn = document.createElement('button');
      btn.className = 'hex-btn';
      btn.id = `hex-${i}`;
      btn.textContent = letters[i];
      btn.setAttribute('aria-label', `Letter ${letters[i]}`);
      btn.setAttribute('tabindex', '-1');
      btn.addEventListener('pointerdown', e => { e.preventDefault(); tapLetter(i); });
      rowDiv.appendChild(btn);
    });
    section.appendChild(rowDiv);
  });
}

function tapLetter(i) {
  const btn = document.getElementById(`hex-${i}`);
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 120);
  currentWord.push({letter: letters[i], index: i});
  updateWordDisplay();
  setFeedback('', '');
}

function deleteLetter() {
  if (!currentWord.length) return;
  currentWord.pop();
  updateWordDisplay();
  setFeedback('', '');
}

function clearWord() {
  currentWord = [];
  updateWordDisplay();
  setFeedback('', '');
}

function updateWordDisplay() {
  const display = document.getElementById('wordDisplay');
  if (!currentWord.length) {
    display.innerHTML = '<span class="placeholder-text">Tap letters to start!</span>';
    document.getElementById('submitBtn').disabled = true;
    return;
  }
  display.innerHTML = '';
  currentWord.forEach(({letter}) => {
    const span = document.createElement('span');
    span.className = 'word-letter';
    span.textContent = letter;
    display.appendChild(span);
  });
  document.getElementById('submitBtn').disabled = currentWord.length < 2;
}

const wordCache = {};

async function submitWord() {
  const word = currentWord.map(l => l.letter).join('').toLowerCase();
  const theme = currentTheme; // capture NOW — don't let theme switching affect the emoji
  if (word.length < 2) { setFeedback('Need 2+ letters! 🌱', 'bad'); return; }
  if (foundWords.includes(word)) {
    setFeedback('Already found that one!', 'dup');
    shakeBuild(); return;
  }

  document.getElementById('submitBtn').disabled = true;

  if (WORD_LIST.has(word)) {
    document.getElementById('submitBtn').disabled = false;
    acceptWord(word, theme); return;
  }

  if (word in wordCache) {
    document.getElementById('submitBtn').disabled = false;
    if (wordCache[word]) { acceptWord(word, theme); } else { rejectWord(word); }
    return;
  }

  setFeedback('🔍 Checking...', '');
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    wordCache[word] = res.ok;
    document.getElementById('submitBtn').disabled = false;
    if (res.ok) { acceptWord(word, theme); } else { rejectWord(word); }
  } catch {
    document.getElementById('submitBtn').disabled = false;
    rejectWord(word);
  }
}

function acceptWord(word, theme) {
  foundWords.push(word);
  score += word.length;
  updateScore();
  renderFoundWords();
  triggerConfetti();
  glowBuild();
  const pts = `+${word.length} point${word.length > 1 ? 's' : ''}`;
  setFeedback(theme.success(word.length, pts), 'good');
  updateProgress();
  currentWord = [];
  setTimeout(updateWordDisplay, 300);
}

function rejectWord(word) {
  setFeedback(`Hmm, "${word}" isn't a word — try again! 🤔`, 'bad');
  shakeBuild();
  currentWord = [];
  updateWordDisplay();
}

function shakeBuild() {
  const d = document.getElementById('wordDisplay');
  d.classList.remove('shake'); void d.offsetWidth;
  d.classList.add('shake');
  setTimeout(() => d.classList.remove('shake'), 400);
}

function glowBuild() {
  const d = document.getElementById('wordDisplay');
  d.classList.remove('glow'); void d.offsetWidth;
  d.classList.add('glow');
  setTimeout(() => d.classList.remove('glow'), 500);
}

function setFeedback(msg, type) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + type;
}

function renderFoundWords() {
  const el = document.getElementById('foundWords');
  if (!foundWords.length) {
    el.innerHTML = '<span class="placeholder-text">No words yet — tap letters below!</span>';
    return;
  }
  if (foundWords.length === 1) { el.innerHTML = ''; }
  const chip = document.createElement('span');
  chip.className = 'word-chip';
  chip.textContent = foundWords[foundWords.length - 1];
  el.insertBefore(chip, el.firstChild);
}

function updateScore() {
  document.getElementById('wordCount').textContent = foundWords.length;
  document.getElementById('scoreCount').textContent = score;

  // Work out which level we're on
  const newLevel = LEVEL_MILESTONES.filter(m => score >= m).length - 1;
  const levels = currentTheme.levels || ['🌱 Lv1','🌸 Lv2','🌺 Lv3','🌻 Lv4'];
  document.getElementById('levelName').textContent = levels[Math.min(newLevel, levels.length - 1)];

  // Fire level-up if we just crossed a milestone
  if (newLevel > currentLevel) {
    currentLevel = newLevel;
    showLevelUp(levels[Math.min(currentLevel, levels.length - 1)]);
  }
}

function showLevelUp(levelName) {
  // Big confetti burst
  triggerConfetti();
  triggerConfetti();

  // Toast
  const toast = document.createElement('div');
  toast.className = 'levelup-toast';
  toast.innerHTML = `
    <span class="toast-emoji">🎉</span>
    <span class="toast-title">Level Up!</span>
    <span class="toast-sub">${levelName}</span>
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

function updateProgress() {
  const p = currentTheme.progress;
  const section = document.getElementById('progressSection');
  const flowers = foundWords.map((_, i) => p[i % p.length]).join('');
  section.innerHTML = `<div class="progress-flowers">${flowers}</div>`;
}

function triggerConfetti() {
  requestAnimationFrame(() => {
    const container = document.getElementById('confettiContainer');
    const emojis = currentTheme.confetti;
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = (15 + Math.random() * 70) + '%';
      p.style.top  = (25 + Math.random() * 25) + '%';
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      p.style.fontSize = (0.9 + Math.random() * 0.9) + 'rem';
      container.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
  });
}

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement === document.getElementById('aiThemeInput')) return;
  const key = e.key;
  if (/^[a-zA-Z]$/.test(key)) {
    const upper = key.toUpperCase();
    if (letters.includes(upper)) tapLetter(letters.indexOf(upper));
    return;
  }
  if (key === 'Enter')     { if (currentWord.length >= 2) submitWord(); return; }
  if (key === 'Backspace') { deleteLetter(); return; }
  if (key === 'Escape')    { clearWord(); return; }
});

// ─── SHARE ───────────────────────────────────────────────────────────────────
function shareScore() {
  const el = document.getElementById('shareConfirm');
  if (foundWords.length === 0) {
    el.textContent = 'Find some words first! 🌱';
    setTimeout(() => el.textContent = '', 2000);
    return;
  }
  const p = currentTheme.progress;
  const flowers = foundWords.map((_, i) => p[i % p.length]).join('');
  const text = `${flowers}\nI found ${foundWords.length} word${foundWords.length > 1 ? 's' : ''} and scored ${score} points on PathWords!\npathwords.netlify.app`;
  navigator.clipboard.writeText(text).then(() => {
    el.textContent = '✅ Copied to clipboard!';
    setTimeout(() => el.textContent = '', 2500);
  }).catch(() => { prompt('Copy this to share:', text); });
}

// ─── AI THEME GENERATOR ──────────────────────────────────────────────────────
async function generateAITheme() {
  const input = document.getElementById('aiThemeInput').value.trim();
  if (!input) return;

  const btn = document.getElementById('aiThemeBtn');
  const status = document.getElementById('aiStatus');
  btn.disabled = true;
  status.textContent = '✨ Creating your theme…';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You generate color themes for a kids' word puzzle game called PathWords.
Return ONLY valid JSON — no markdown, no backticks, no explanation whatsoever.
The JSON must have exactly these fields:
{
  "logo": "EMOJI Name<span>Words</span>",
  "tagline": "EMOJI short phrase · Find words · Fun ending! EMOJI",
  "foundLabel": "EMOJI Words found",
  "newGame": "EMOJI New Game",
  "share": "EMOJI Share my score",
  "confetti": ["e1","e2","e3","e4","e5","e6","e7","e8","e9","e10"],
  "progress": ["e1","e2","e3","e4","e5","e6","e7","e8"],
  "successMsgs": ["EMOJI Nice!", "EMOJI Good!", "EMOJI Great!", "EMOJI Brilliant!", "EMOJI Amazing!"],
  "vars": {
    "--bg": "#hex",
    "--cream": "#hex",
    "--pollen": "#hex",
    "--gold": "#hex",
    "--gold-dark": "#hex",
    "--sage": "#hex",
    "--sage-dark": "#hex",
    "--charcoal": "#hex",
    "--pink": "#hex",
    "--pink-dark": "#hex",
    "--red": "#hex",
    "--placeholder": "#hex",
    "--found-border": "#hex"
  }
}
RULES: Kid-friendly and fun. Light themes must have dark charcoal (#333 range). Dark themes must have light charcoal (#eee range) AND bright high-contrast gold/sage. Text contrast must be 4.5:1 minimum. Make it creative and match the vibe perfectly.`,
        messages: [{ role: 'user', content: `Create a PathWords theme for: "${input}"` }]
      })
    });

    const data = await response.json();
    const raw = data?.content?.[0]?.text?.trim() ?? '';
    const clean = raw.replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
    const t = JSON.parse(clean);

    // Build a proper theme object from the AI response
    const msgs = t.successMsgs || ['✨ Nice!','🌟 Good!','🎉 Great!','🏆 Brilliant!','💫 Amazing!'];
    const customTheme = {
      key: 'custom',
      emoji: '✨',
      name: input.length > 10 ? input.slice(0,10)+'…' : input,
      vars: t.vars,
      logo: t.logo,
      tagline: t.tagline,
      foundLabel: t.foundLabel,
      newGame: t.newGame,
      share: t.share,
      confetti: t.confetti,
      progress: t.progress,
      success(len, pts) {
        const m = msgs[Math.min(len - 2, msgs.length - 1)] || msgs[msgs.length - 1];
        return `${m} ${pts}`;
      },
    };

    // Add/replace custom theme and apply it
    THEMES.custom = customTheme;
    applyTheme('custom');

    // Add or update the custom button in the picker
    let customBtn = document.querySelector('[data-theme="custom"]');
    if (!customBtn) {
      customBtn = document.createElement('button');
      customBtn.className = 'theme-btn';
      customBtn.dataset.theme = 'custom';
      customBtn.onclick = () => applyTheme('custom');
      document.getElementById('themeRow').appendChild(customBtn);
    }
    customBtn.innerHTML = `<span class="theme-emoji">✨</span><span class="theme-name">${customTheme.name}</span>`;

    status.textContent = `🎉 "${input}" theme applied!`;
    setTimeout(() => status.textContent = '', 3000);

  } catch (err) {
    status.textContent = '😅 Something went wrong — try again!';
    setTimeout(() => status.textContent = '', 3000);
  }

  btn.disabled = false;
}

// Allow Enter key in AI input
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('aiThemeInput')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') generateAITheme();
  });
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildThemePicker();
// Restore saved theme, or default to Deep Sea
try {
  const saved = localStorage.getItem('pathwords-theme');
  applyTheme((saved && THEMES[saved]) ? saved : 'garden');
} catch {
  applyTheme('garden');
}
newGame();
</script>
